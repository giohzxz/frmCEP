<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca por CEP</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container">
        <h1>Consulta endereço por CEP</h1>
        <form id="form">
            <label for="CEP">Digite o CEP</label>
            <imput type="text" id="CEP" name="CEP" placeholder="Digite o CEP" required></imput>
            <button type="submit">Buscar</button>
    </form>
    <ul id="resultado">
        <li><strong>Logradouro:</strong> <span id="logradouro">-</span></li>
        <li><strong>Bairro:</strong> <span id="bairro">-</span></li>
        <li><strong>Cidade:</strong> <span id="cidade">-</span></li>
        <li><strong>UF:</strong> <span id="uf">-</span></li>
    </ul>
</div>
    <script> src="app.js"</script>
    </div>
</body>
</html>
